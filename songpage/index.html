<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08070a">
<meta name="description" content="Musik — a single-track player streaming straight from the Raspberry Pi.">
<title>Musik &middot; {{TITLE}}</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="room" aria-hidden="true">
  <img class="room-light" src="/cover.jpg" alt="">
</div>

<header class="topbar">
  <span class="wordmark">Musik</span>
  <span class="state" id="state">Paused</span>
</header>

<main class="stage">
  <figure class="art">
    <img src="/cover.jpg" alt="Album art for {{ALBUM}}">
  </figure>

  <div class="meta">
    <h1 class="title">{{TITLE}}</h1>
    <p class="artist">{{ARTIST}}</p>
    <p class="album">{{ALBUM}}</p>
  </div>

  <div class="transport">
    <button id="play" class="play" type="button" aria-label="Play {{TITLE}}">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring-bg" cx="60" cy="60" r="55"></circle>
        <circle class="ring-fg" cx="60" cy="60" r="55"></circle>
      </svg>
      <svg class="glyph icon-play" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8.5 5.2v13.6L19 12z"></path>
      </svg>
      <svg class="glyph icon-pause" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7.6 5h3.1v14H7.6zM13.3 5h3.1v14h-3.1z"></path>
      </svg>
    </button>

    <div class="bar">
      <input id="seek" type="range" min="0" max="100" value="0" step="0.1"
             disabled aria-label="Playback position">
      <div class="times">
        <span id="cur">0:00</span>
        <span id="dur">0:00</span>
      </div>
    </div>
  </div>

  <p class="status" id="status" role="status" aria-live="polite"></p>
  <p class="hint">Streaming from the Raspberry Pi &middot; loads as it plays</p>
</main>

<audio id="player" src="/track" preload="metadata"></audio>

<script>
var audio = document.getElementById("player");
var playBtn = document.getElementById("play");
var seek = document.getElementById("seek");
var cur = document.getElementById("cur");
var dur = document.getElementById("dur");
var statusEl = document.getElementById("status");
var stateEl = document.getElementById("state");
var ring = document.querySelector(".ring-fg");

var CIRC = 2 * Math.PI * 55;
ring.style.strokeDasharray = CIRC;
ring.style.strokeDashoffset = CIRC;

function fmt(s){
  if(!isFinite(s) || s < 0) return "0:00";
  var m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return m + ":" + (ss < 10 ? "0" : "") + ss;
}

function paint(){
  var p = (audio.duration && isFinite(audio.duration))
    ? audio.currentTime / audio.duration : 0;
  p = Math.max(0, Math.min(1, p));
  ring.style.strokeDashoffset = CIRC * (1 - p);
  seek.style.setProperty("--fill", (p * 100).toFixed(2) + "%");
}

function say(msg, isError){
  statusEl.textContent = msg || "";
  statusEl.classList.toggle("error", !!isError);
}

playBtn.addEventListener("click", function(){
  if (audio.paused) {
    var p = audio.play();
    if (p && p.catch) p.catch(function(){ say("Tap play again — the browser blocked autoplay.", true); });
  } else {
    audio.pause();
  }
});

audio.addEventListener("play", function(){
  playBtn.classList.add("playing");
  playBtn.setAttribute("aria-label", "Pause");
  stateEl.textContent = "Playing";
  document.body.classList.add("is-playing");
  say("");
});
audio.addEventListener("pause", function(){
  playBtn.classList.remove("playing");
  playBtn.setAttribute("aria-label", "Play");
  stateEl.textContent = "Paused";
  document.body.classList.remove("is-playing");
});
audio.addEventListener("ended", function(){
  stateEl.textContent = "Ended";
  document.body.classList.remove("is-playing");
});

audio.addEventListener("loadedmetadata", function(){
  dur.textContent = fmt(audio.duration);
  seek.max = audio.duration || 100;
  seek.disabled = false;
  paint();
});
audio.addEventListener("waiting", function(){
  say("Buffering…");
});
audio.addEventListener("canplay", function(){
  if (!audio.paused) say("");
});
audio.addEventListener("timeupdate", function(){
  if (!dragging) seek.value = audio.currentTime;
  cur.textContent = fmt(audio.currentTime);
  paint();
});
audio.addEventListener("error", function(){
  say("Couldn’t reach the track. Check that songpage is running on the Pi, then tap play to retry.", true);
  stateEl.textContent = "Offline";
  seek.disabled = true;
});

var dragging = false;
seek.addEventListener("input", function(){
  dragging = true;
  cur.textContent = fmt(parseFloat(seek.value));
  var p = (audio.duration && isFinite(audio.duration)) ? seek.value / audio.duration : 0;
  p = Math.max(0, Math.min(1, p));
  ring.style.strokeDashoffset = CIRC * (1 - p);
  seek.style.setProperty("--fill", (p * 100).toFixed(2) + "%");
});
seek.addEventListener("change", function(){
  audio.currentTime = parseFloat(seek.value);
  dragging = false;
});

document.addEventListener("keydown", function(e){
  if (e.target === seek) return;
  if (e.code === "Space") { e.preventDefault(); playBtn.click(); }
  if (e.code === "ArrowRight") audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
  if (e.code === "ArrowLeft") audio.currentTime = Math.max(0, audio.currentTime - 5);
});
</script>
</body>
</html>
